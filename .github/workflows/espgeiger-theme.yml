# Appends ESPGeiger brand CSS to global.css after each Static Site CI deploy
# (Upptime has no custom-CSS config hook; global.css loads last, so it wins).
# Own file, so the template updater leaves it alone. Idempotent.
name: ESPGeiger theme

on:
  workflow_run:
    workflows: ["Static Site CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Append ESPGeiger brand CSS
        run: |
          f=global.css
          [ -f "$f" ] || { echo "no global.css; nothing to do"; exit 0; }
          grep -q "ESPGeiger brand overrides" "$f" && { echo "already branded"; exit 0; }
          # White+grey base, #0066cc accent, status colours, mono wordmark (.logo div).
          printf '\n/* ESPGeiger brand overrides */\n:root{--body-background-color:#f8f9fa;--body-text-color:#212529;--card-background-color:#ffffff;--nav-background-color:#ffffff;--nav-border-bottom-color:#dee2e6;--card-border-color:#dee2e6;--nav-current-border-bottom-color:#0066cc;--up-border-left-color:#22c55e;--tag-up-background-color:#22c55e;--degraded-border-left-color:#f59e0b;--tag-degraded-background-color:#f59e0b;--change-background-color:#f59e0b;--down-border-left-color:#dc2626;--tag-down-background-color:#dc2626;--down-background-color:#fee2e2;--error-button-background-color:#0066cc;--error-button-border-color:#004a99;--submit-button-background-color:#0066cc;--submit-button-border-color:#004a99}\n.logo div{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberty Mono","Courier New",monospace;font-weight:600;letter-spacing:-.02em}\na{color:#0066cc}\n' >> "$f"
          git config user.name "ESPGeiger Bot"
          git config user.email "73812536+upptime-bot@users.noreply.github.com"
          git add "$f"
          git commit -m "Apply ESPGeiger brand overrides [skip ci]"
          git push
