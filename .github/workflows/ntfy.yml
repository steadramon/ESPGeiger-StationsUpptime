# Pushes Upptime downtime/recovery to ntfy (topic in repo secret NTFY_URL).
name: ntfy

on:
  issues:
    types: [opened, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Push to ntfy
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          ACTION: ${{ github.event.action }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          [ -z "$NTFY_URL" ] && { echo "NTFY_URL secret not set; skipping."; exit 0; }
          # Only Upptime's downtime issues, not any manual issue.
          case "$ISSUE_TITLE" in
            *[Dd]own*) ;;
            *) echo "Not a downtime issue; skipping."; exit 0 ;;
          esac
          if [ "$ACTION" = "opened" ]; then
            HDR="ESPGeiger: site down"; PRIO="high"; TAGS="red_circle"
          else
            HDR="ESPGeiger: recovered"; PRIO="default"; TAGS="white_check_mark"
          fi
          # Emoji title -> body (HTTP headers are ASCII); Click opens the issue.
          curl -fsS -m 15 --retry 2 \
            -H "Title: $HDR" -H "Priority: $PRIO" -H "Tags: $TAGS" \
            -H "Click: $ISSUE_URL" -d "$ISSUE_TITLE" "$NTFY_URL"
