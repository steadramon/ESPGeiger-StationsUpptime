owner: steadramon
repo: ESPGeiger-StationsUpptime

sites:
  - name: Stations site
    url: https://stations.espgeiger.com/health
    __dangerous__body-down-if-text-missing: "OK"
  - name: API (firmware)
    url: http://api.espgeiger.com/health
    __dangerous__body-down-if-text-missing: "OK"
  - name: Main site
    url: https://espgeiger.com/
  - name: Firmware installer
    url: https://install.espgeiger.com/

status-website:
  cname: upptime.espgeiger.com
  name: ESPGeiger status
  # ESPGeiger radiation-trefoil mark (served from the main site).
  faviconSvg: https://stations.espgeiger.com/favicon.svg
  favicon: https://stations.espgeiger.com/favicon-96x96.png
  logoUrl: https://stations.espgeiger.com/favicon.svg
  theme: light
  introTitle: "Live status of the ESPGeiger station registry and firmware API."
  introMessage: Real-time uptime for stations.espgeiger.com and api.espgeiger.com, powered by GitHub Actions. No server to run, nothing in the serving path.
  navbar:
    - title: Status
      href: /
    - title: ESPGeiger
      href: https://stations.espgeiger.com
